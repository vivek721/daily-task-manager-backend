# SonarCloud Configuration
sonar.projectKey=daily-task-manager-backend
sonar.organization=your-sonarcloud-org

# Project Information
sonar.projectName=Daily Task Manager Backend
sonar.projectVersion=1.0.0

# Source Configuration
sonar.sources=src
sonar.tests=src/__tests__
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Coverage Configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/types/**,**/config/**

# Language Configuration
sonar.typescript.node=node_modules/typescript/lib/typescript.js

# Quality Gate Configuration
sonar.qualitygate.wait=true

# Additional Settings
sonar.sourceEncoding=UTF-8