name: Continuous Integration

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  NODE_VERSION: '18.x'

jobs:
  # Job 1: TypeScript Compilation and Type Checking
  typecheck:
    name: TypeScript Type Checking
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run TypeScript type checking
        run: npm run typecheck
        
      - name: Run TypeScript compilation
        run: npm run build

  # Job 2: Code Quality and Linting
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run ESLint
        run: npm run lint
        
      - name: Check code formatting with Prettier
        run: npm run format:check

  # Job 3: Unit and Integration Tests
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    
    # Service containers for PostgreSQL
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: daily_task_manager_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests with coverage
        run: npm run test:ci
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/daily_task_manager_test
          JWT_SECRET: test-jwt-secret
          SESSION_SECRET: test-session-secret
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job 4: Docker Build Validation
  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    # The app creates its tables on startup and exits if PostgreSQL is unreachable,
    # so the smoke test needs a real (throwaway) database.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: smoke_user
          POSTGRES_PASSWORD: smoke_password
          POSTGRES_DB: daily_task_manager_smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          # Load the image into the local Docker daemon so `docker run` can use it
          load: true
          tags: daily-task-manager-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          # Host networking lets the container reach the postgres service on localhost:5432.
          # Google OAuth values are dummies: the strategy only needs them to be set at startup.
          docker run -d --name test-container --network host \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=daily_task_manager_smoke \
            -e DB_USER=smoke_user \
            -e DB_PASSWORD=smoke_password \
            -e JWT_SECRET=ci-smoke-jwt-secret \
            -e SESSION_SECRET=ci-smoke-session-secret \
            -e GOOGLE_CLIENT_ID=ci-dummy-client-id \
            -e GOOGLE_CLIENT_SECRET=ci-dummy-client-secret \
            -e FRONTEND_URL=http://localhost:5173 \
            daily-task-manager-backend:test

          # Wait up to 60s for /health instead of a fixed sleep
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health; then
              echo
              echo "Health check passed"
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' test-container)" != "true" ]; then
              echo "Container exited during startup"
              break
            fi
            sleep 2
          done

          # Protected routes must reject requests without a token
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/tasks || true)
          echo "GET /api/tasks without a token -> $status"

          docker logs test-container
          curl -fsS http://localhost:3001/health > /dev/null
          test "$status" = "401"

      - name: Stop test container
        if: always()
        run: docker rm -f test-container || true

  # Job 5: Security Scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        
      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # Job 6: Database Migration Testing
  migration-test:
    name: Database Migration Testing
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: migration_test_user
          POSTGRES_PASSWORD: migration_test_password
          POSTGRES_DB: migration_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build application
        run: npm run build
        
      - name: Test database migration scripts
        run: |
          # Test that migration scripts can be executed
          PGPASSWORD=migration_test_password psql -h localhost -U migration_test_user -d migration_test_db -f ../init-db.sql || echo "init-db.sql not found, skipping"
          PGPASSWORD=migration_test_password psql -h localhost -U migration_test_user -d migration_test_db -f ../init-users.sql || echo "init-users.sql not found, skipping"
          PGPASSWORD=migration_test_password psql -h localhost -U migration_test_user -d migration_test_db -f ../init-cron.sql || echo "init-cron.sql not found, skipping"
        env:
          DATABASE_URL: postgresql://migration_test_user:migration_test_password@localhost:5432/migration_test_db

  # Final job that depends on all others - used for branch protection
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, docker, security, migration-test]
    if: always()
    
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.typecheck.result }}" != "success" || 
                "${{ needs.lint.result }}" != "success" || 
                "${{ needs.test.result }}" != "success" || 
                "${{ needs.docker.result }}" != "success" || 
                "${{ needs.security.result }}" != "success" || 
                "${{ needs.migration-test.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"