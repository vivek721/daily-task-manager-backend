name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  dependency-audit:
    name: Security Audit & Dependency Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run security audit
        run: npm audit --audit-level=moderate
        
      - name: Check for outdated packages
        run: npm outdated || true
        
      - name: Generate dependency report
        run: |
          echo "# Dependency Report" > dependency-report.md
          echo "Generated on: $(date -u)" >> dependency-report.md
          echo "" >> dependency-report.md
          echo "## Security Audit" >> dependency-report.md
          npm audit --json | jq -r '.vulnerabilities | to_entries[] | "- **\(.key)**: \(.value.severity) - \(.value.title)"' >> dependency-report.md || echo "No vulnerabilities found" >> dependency-report.md
          echo "" >> dependency-report.md
          echo "## Outdated Packages" >> dependency-report.md
          npm outdated --json | jq -r 'to_entries[] | "- **\(.key)**: Current: \(.value.current), Latest: \(.value.latest)"' >> dependency-report.md || echo "All packages are up to date" >> dependency-report.md
          
      - name: Create Issue on Security Vulnerabilities
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Automated security audit has detected vulnerabilities in dependencies.\n\n';
            
            if (fs.existsSync('dependency-report.md')) {
              body += fs.readFileSync('dependency-report.md', 'utf8');
            }
            
            body += '\n\n---\n*This issue was automatically created by the dependency update workflow.*';
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Security vulnerabilities detected in dependencies',
              body: body,
              labels: ['security', 'dependencies', 'automated']
            });

  update-dependencies:
    name: Update Minor Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' # Only run on manual trigger
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
      - name: Update dependencies
        run: |
          # Update patch and minor versions only (not major)
          npm update
          
      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Run tests after update
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          npm ci
          npm run test:ci
          
      - name: Create Pull Request
        if: steps.verify-changed-files.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update minor dependencies'
          title: '🤖 Automated dependency updates'
          body: |
            This PR was automatically created to update minor and patch version dependencies.
            
            ## Changes
            - Updated npm dependencies to latest compatible versions
            - All tests are passing
            
            ## Testing
            - ✅ Unit tests pass
            - ✅ Integration tests pass
            - ✅ TypeScript compilation successful
            - ✅ Linting checks pass
            
            ---
            *This PR was automatically created by the dependency update workflow.*
          branch: automated/dependency-updates
          delete-branch: true
          labels: |
            dependencies
            automated
            chore